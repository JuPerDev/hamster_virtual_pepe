<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="200 30 520 280">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .line { stroke:#35110b; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
      .lineThin { stroke:#35110b; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <g id="daisy">
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin"/>
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin" transform="rotate(60)"/>
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin" transform="rotate(120)"/>
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin" transform="rotate(180)"/>
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin" transform="rotate(240)"/>
      <ellipse cx="0" cy="-13" rx="5" ry="9" fill="#fff6f6" class="lineThin" transform="rotate(300)"/>
      <circle r="6" fill="#f5c542" class="lineThin"/>
