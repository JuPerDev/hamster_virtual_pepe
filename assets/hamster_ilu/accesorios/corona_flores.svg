    <use href="#leaf" transform="translate(420 192) rotate(120)"/>
    <use href="#leaf" transform="translate(385 200) rotate(220)"/>
    <use href="#daisy" transform="translate(298 218)"/>
    <use href="#daisy" transform="translate(425 188)"/>
    <use href="#daisy" transform="translate(578 196)"/>
    <use href="#daisy" transform="translate(640 220)"/>
    <use href="#tulip" transform="translate(360 207) rotate(-8)"/>
