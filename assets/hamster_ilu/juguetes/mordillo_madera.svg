      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>.line{stroke:#35110b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;}.lineThin{stroke:#35110b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}</style>
