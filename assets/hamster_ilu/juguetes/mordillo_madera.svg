    <rect x="280" y="150" width="40" height="50" rx="8" fill="#d4a060" class="line"/>
    <rect x="340" y="150" width="40" height="50" rx="8" fill="#c4954a" class="line"/>
    <rect x="400" y="150" width="40" height="50" rx="8" fill="#d4a060" class="line"/>
    <rect x="460" y="150" width="40" height="50" rx="8" fill="#c4954a" class="line"/>
    <line x1="290" y1="165" x2="310" y2="165" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="290" y1="180" x2="310" y2="180" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="350" y1="165" x2="370" y2="165" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="350" y1="180" x2="370" y2="180" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="410" y1="165" x2="430" y2="165" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="410" y1="180" x2="430" y2="180" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="470" y1="165" x2="490" y2="165" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
    <line x1="470" y1="180" x2="490" y2="180" class="lineThin" stroke="#a67c3a" opacity="0.5"/>
